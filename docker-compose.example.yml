services:
  outlook-mail-manager:
    build: .
    container_name: outlook-mail-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
    ports:
      - "127.0.0.1:3005:3005"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3005/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
