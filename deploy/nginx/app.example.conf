server {
    server_name mail.example.com;

    # When Cloudflare proxying is enabled, configure real_ip_header and the
    # official Cloudflare IP ranges in /etc/nginx/conf.d/cloudflare-real-ip.conf.
    # Nginx then overwrites X-Real-IP; the application never trusts a browser-
    # supplied CF-Connecting-IP header directly.

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
